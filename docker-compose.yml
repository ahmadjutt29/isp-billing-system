services:
  # MySQL Database
  db:
    image: mysql:8
    container_name: isp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - isp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # .NET Backend API
  backend:
    build:
      context: ./IspBackend
      dockerfile: Dockerfile
    container_name: isp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=${DB_NAME};User=root;Password=${MYSQL_ROOT_PASSWORD};
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=IspBackend
      - Jwt__Audience=IspFrontend
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - isp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/weatherforecast" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # React Frontend
  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    container_name: isp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - isp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  isp-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
